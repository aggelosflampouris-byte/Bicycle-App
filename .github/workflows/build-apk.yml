name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          else
            echo "Warning: GOOGLE_SERVICES_JSON_B64 secret is missing. The build may fail."
          fi

      - name: Run Unit Tests
        run: |
          # Retry up to 3 times to mitigate transient Gradle download failures;
          # refresh dependencies on retries so cached resolution errors are cleared.
          for i in 1 2 3; do
            if [ "$i" -eq 1 ]; then
              ./gradlew testDebugUnitTest --stacktrace && exit 0
            else
              ./gradlew --stop
              ./gradlew testDebugUnitTest --refresh-dependencies --stacktrace && exit 0
            fi
            echo "Unit tests failed, retrying in 15 seconds... (Attempt $i of 3)"
            sleep 15
          done
          exit 1

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build R8 Release APK
        run: |
          ./gradlew --stop
          ./gradlew assembleRelease --stacktrace

      - name: Verify R8 Keep Rules
        run: |
          MAPPING="app/build/outputs/mapping/release/mapping.txt"
          for cls in \
            "com.fitnessapp.tracker.data.remote.api.OpenMeteoApiService" \
            "com.fitnessapp.tracker.data.remote.model.OpenMeteoResponse" \
            "com.fitnessapp.tracker.data.remote.EnvironmentSnapshot" \
            "com.fitnessapp.tracker.data.local.entity.WorkoutSessionEntity" \
            "com.fitnessapp.tracker.data.local.entity.WellnessCheckInEntity" \
            "com.fitnessapp.tracker.data.local.entity.TwinSnapshotEntity" \
            "com.fitnessapp.tracker.service.RoutePoint" \
            "com.fitnessapp.tracker.util.BackupData"; do
            if ! grep -Fxq "${cls} -> ${cls}:" "$MAPPING"; then
              echo "::error::Missing R8 keep rule for ${cls}"
              exit 1
            fi
          done
          echo "All critical models & APIs verified un-obfuscated in R8 mapping."

      - name: Upload Test & Lint Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CI-Diagnostic-Reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/smart-track.apk
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/smart-track-release.apk

      - name: Upload APK & Mapping Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartTrack-APK
          path: |
            app/build/outputs/apk/debug/smart-track.apk
            app/build/outputs/apk/release/smart-track-release.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/smart-track.apk
            app/build/outputs/apk/release/smart-track-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
