name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Write the AI Coach API key into local.properties so build.gradle.kts
      # can read it cleanly while preserving the existing GEMINI_API_KEY secret.
      # local.properties is gitignored so the key is never committed.
      - name: Inject API key into local.properties
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          else
            echo "Warning: GOOGLE_SERVICES_JSON_B64 secret is missing. The build may fail."
          fi

      - name: Run Unit Tests
        run: |
          # Retry up to 3 times to mitigate transient Gradle download failures
          for i in 1 2 3; do
            ./gradlew testDebugUnitTest --stacktrace && exit 0
            echo "Unit tests failed, retrying in 15 seconds... (Attempt $i of 3)"
            sleep 15
          done
          exit 1

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Test & Lint Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CI-Diagnostic-Reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/smart-track.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTrack-APK
          path: app/build/outputs/apk/debug/smart-track.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/smart-track.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
